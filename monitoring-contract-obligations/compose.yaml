name: monitoring-contract-obligations

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: monitoring_obligations
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U monitoring -d monitoring_obligations
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
